[project]
name = "froment-software"
revision = "1.0"

[providers]
runtime = "sops://secrets/{project}/{profile}.yaml"

[profiles.default]
API_TOKEN_HMAC_KEY = { description = "API token HMAC key", required = false }
BOOTSTRAP_PASSWORD_SCRYPT = { description = "Bootstrap administrator password hash", required = false }
PASETO_SECRET_KEY = { description = "PASETO secret key", required = false }
QUOTE_LINK_HMAC_KEY = { description = "Public quote link HMAC key", required = false }
REFRESH_HMAC_KEY = { description = "Refresh token HMAC key", required = false }
RESEND_API_KEY = { description = "Resend sending API key", required = false }
STRIPE_SECRET_KEY = { description = "Stripe server API key", required = false }
STRIPE_WEBHOOK_SECRET = { description = "Stripe webhook signing secret", required = false }
SIGNWELL_API_KEY = { description = "SignWell API key", required = false }
SUPERPDP_CLIENT_ID = { description = "SUPER PDP OAuth client identifier", required = false }
SUPERPDP_CLIENT_SECRET = { description = "SUPER PDP OAuth client secret", required = false }

[profiles.development.defaults]
providers = ["runtime"]

[profiles.development]
API_TOKEN_HMAC_KEY = { required = true }
BOOTSTRAP_PASSWORD_SCRYPT = { required = true }
PASETO_SECRET_KEY = { required = true }
QUOTE_LINK_HMAC_KEY = { required = true }
REFRESH_HMAC_KEY = { required = true }

[profiles.production.defaults]
providers = ["runtime"]
required = true

[profiles.production]
API_TOKEN_HMAC_KEY = { required = true }
BOOTSTRAP_PASSWORD_SCRYPT = { required = true }
PASETO_SECRET_KEY = { required = true }
QUOTE_LINK_HMAC_KEY = { required = true }
REFRESH_HMAC_KEY = { required = true }
RESEND_API_KEY = { required = false }
STRIPE_SECRET_KEY = { required = false }
STRIPE_WEBHOOK_SECRET = { required = false }
SIGNWELL_API_KEY = { required = false }
SUPERPDP_CLIENT_ID = { required = false }
SUPERPDP_CLIENT_SECRET = { required = false }

[profiles.staging.defaults]
providers = ["runtime"]
required = true

[profiles.staging]
API_TOKEN_HMAC_KEY = { required = true }
BOOTSTRAP_PASSWORD_SCRYPT = { required = true }
PASETO_SECRET_KEY = { required = true }
QUOTE_LINK_HMAC_KEY = { required = true }
REFRESH_HMAC_KEY = { required = true }
RESEND_API_KEY = { required = false }
STRIPE_SECRET_KEY = { required = false }
STRIPE_WEBHOOK_SECRET = { required = false }
SIGNWELL_API_KEY = { required = false }
SUPERPDP_CLIENT_ID = { required = false }
SUPERPDP_CLIENT_SECRET = { required = false }

[scopes.runtime]
secrets = [
  "API_TOKEN_HMAC_KEY",
  "BOOTSTRAP_PASSWORD_SCRYPT",
  "PASETO_SECRET_KEY",
  "QUOTE_LINK_HMAC_KEY",
  "REFRESH_HMAC_KEY",
  "RESEND_API_KEY",
  "STRIPE_SECRET_KEY",
  "STRIPE_WEBHOOK_SECRET",
  "SIGNWELL_API_KEY",
  "SUPERPDP_CLIENT_ID",
  "SUPERPDP_CLIENT_SECRET",
]
