<article class="about">
  <header>
    <h1>{{ i18n.t("about.faq.title") }}</h1>
  </header>

  <section aria-label="FAQ">
    <div class="faq-list">
      @for (item of faqKeys; track item.questionKey) {
        <details class="faq-item">
          <summary>
            <span>{{ i18n.t(item.questionKey) }}</span>
            <span aria-hidden="true">+</span>
          </summary>
          <div class="faq-answer">
            <p>{{ i18n.t(item.answerKey) }}</p>
          </div>
        </details>
      }
    </div>
  </section>

  <section aria-labelledby="contact">
    <h2 id="contact" class="anchored-title">
      <span>{{ i18n.t("about.contact.title") }}</span
      ><app-anchor-link fragment="contact" />
    </h2>
    <p class="contact-actions">
      <a appLinkButton variant="primary" [href]="contactMailto()"
        ><app-icon name="mail" />{{ i18n.t("about.contact.mail") }}</a
      >
      <a appLinkButton href="https://cal.com/sachahjkl" target="_blank" rel="noreferrer"
        ><app-icon name="calendar" />{{ i18n.t("about.contact.book") }}</a
      >
    </p>
  </section>
</article>
