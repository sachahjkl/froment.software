<article class="about">
  <header>
    <h1>{{ i18n.t('about.faq.title') }}</h1>
  </header>

  <section aria-label="FAQ">
    <div class="faq-list">
      @for (item of faqKeys; track item.questionKey) {
        <details class="faq-item">
          <summary>
            <span>{{ i18n.t(item.questionKey) }}</span>
            <span aria-hidden="true">+</span>
          </summary>
          <div class="faq-answer">
            <p>{{ i18n.t(item.answerKey) }}</p>
          </div>
        </details>
      }
    </div>
  </section>

  <section aria-labelledby="contact-title">
    <h2 id="contact-title">{{ i18n.t('about.contact.title') }}</h2>
    <p><a href="mailto:contact@froment.software">{{ i18n.t('about.contact.mail') }}</a> · <a href="https://cal.com/sachahjkl" target="_blank" rel="noreferrer">{{ i18n.t('about.contact.book') }}</a></p>
  </section>
</article>
