<article class="business-card-page">
  <header class="card-toolbar">
    <div>
      <p><a routerLink="/back-office/dashboard">← Documents</a></p>
      <h1>Carte de visite</h1>
    </div>
    <button class="btn primary" type="button" (click)="print()">Imprimer ou exporter en PDF</button>
  </header>

  <div class="card-sheet" aria-label="Aperçu recto-verso de la carte de visite">
    <section class="business-card front" aria-label="Recto">
      <div class="front-content">
        <div class="identity">
          <h2>Sacha Froment</h2>
          <p>Ingénieur logiciel</p>
        </div>
        <div class="contact-details">
          <p>contact@froment.software</p>
          <p>froment.software</p>
        </div>
      </div>
    </section>

    <section class="business-card back" aria-label="Verso">
      <div class="brand-lockup">
        <img src="/brand/favicon.png" width="48" height="48" alt="" />
        <p>froment.software</p>
      </div>
    </section>
  </div>
</article>
