<section class="login-page" aria-labelledby="back-office-title">
  <div class="login-panel">
    <p class="eyebrow">Accès privé</p>
    <h1 id="back-office-title">Back office</h1>
    <p>Entrez le mot de passe pour accéder aux documents internes.</p>
    <form (submit)="submit($event, password.value)">
      <label for="back-office-password">Mot de passe</label>
      <input #password id="back-office-password" class="input" type="password" autocomplete="current-password" required autofocus />
      @if (error()) { <p class="error" role="alert">Mot de passe incorrect.</p> }
      <button class="btn primary" type="submit" [disabled]="pending()">{{ pending() ? 'Vérification…' : 'Se connecter' }}</button>
    </form>
  </div>
</section>
