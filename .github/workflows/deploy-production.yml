name: Deploy production

on:
  workflow_dispatch:

jobs:
  production:
    permissions:
      attestations: read
      contents: read
      id-token: write
      packages: read
    uses: sachahjkl/deployment-actions/.github/workflows/application-promotion.yml@v5.0.4
    with:
      publishing-workflow-version: v5.0.3
      source-environment: staging
      target-environment: production
