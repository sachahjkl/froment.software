name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  NIX_CONFIG: extra-experimental-features = nix-command flakes
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    if: github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --print-build-logs

  protected-check:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: nix flake check --print-build-logs

  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: protected-check
    runs-on: [self-hosted, nixos]
    concurrency:
      group: publish-image-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
      - run: nix build .#releaseDockerImage --print-build-logs
      - name: Push OCI image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/skopeo-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          export TMPDIR="$RUNNER_TEMP/skopeo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export XDG_CONFIG_HOME="$TMPDIR/config"
          mkdir -p "$XDG_CONFIG_HOME/containers"
          printf 'unqualified-search-registries = []\n' > "$XDG_CONFIG_HOME/containers/registries.conf"
          trap 'rm -rf "$TMPDIR"; rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | nix run .#skopeo -- login --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mapfile -t tags < <(printf '%s\n' "$IMAGE_TAGS" | sed '/^$/d')
          (( ${#tags[@]} > 0 )) || exit 0
          nix run .#skopeo -- copy --authfile "$authfile" --insecure-policy docker-archive:result "docker://${tags[0]}"
          for tag in "${tags[@]:1}"; do
            nix run .#skopeo -- copy --all --authfile "$authfile" "docker://${tags[0]}" "docker://$tag"
          done
