name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  NIX_CONFIG: extra-experimental-features = nix-command flakes
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify-nix:
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: nix --extra-experimental-features "nix-command flakes" flake show
      - run: nix --extra-experimental-features "nix-command flakes" build .#dockerfile

  build-site:
    needs: verify-nix
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: nix --extra-experimental-features "nix-command flakes" develop --command npm ci --prefer-offline
      - run: nix --extra-experimental-features "nix-command flakes" develop --command npm run build
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: site
          path: dist/froment-software/
          retention-days: 7

  container:
    needs: build-site
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
      - name: Build and push image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/podman-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | podman login --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman pull --authfile "$authfile" "$IMAGE_NAME:latest" || true

          build_args=(--authfile "$authfile" --pull=always)
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          while IFS= read -r label; do
            [[ -n "$label" ]] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"
          podman build "${build_args[@]}" .

          while IFS= read -r tag; do
            [[ -n "$tag" ]] && podman push --authfile "$authfile" "$tag"
          done <<< "$IMAGE_TAGS"
