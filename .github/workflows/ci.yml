name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  NIX_CONFIG: extra-experimental-features = nix-command flakes
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    if: github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --print-build-logs --max-jobs 1

  protected-check:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --print-build-logs --max-jobs 1

  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: protected-check
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
      - run: nix build .#releaseDockerImage --print-build-logs
      - id: publish
        name: Push OCI image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/skopeo-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          export TMPDIR="$RUNNER_TEMP/skopeo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TMPDIR"
          trap 'rm -rf "$TMPDIR"; rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | nix run .#skopeo -- login --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mapfile -t tags < <(printf '%s\n' "$IMAGE_TAGS" | sed '/^$/d')
          (( ${#tags[@]} > 0 )) || exit 0
          nix run .#skopeo -- copy --authfile "$authfile" --insecure-policy docker-archive:result "docker://${tags[0]}"
          for tag in "${tags[@]:1}"; do
            nix run .#skopeo -- copy --all --authfile "$authfile" "docker://${tags[0]}" "docker://$tag"
          done
          digest=$(nix run .#skopeo -- inspect --authfile "$authfile" --format '{{.Digest}}' "docker://${tags[0]}")
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$digest" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Generate SBOM
        env:
          SBOM: ${{ runner.temp }}/froment-software.spdx.json
          TAR_ARCHIVE: ${{ runner.temp }}/froment-software.tar
        run: |
          gzip --decompress --stdout result >"$TAR_ARCHIVE"
          nix run .#syft -- "docker-archive:$TAR_ARCHIVE" --output "spdx-json=$SBOM"

      - name: Sign image and SBOM
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          SBOM: ${{ runner.temp }}/froment-software.spdx.json
        run: |
          printf '%s' "$GHCR_TOKEN" | nix run .#cosign -- login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          nix run .#cosign -- sign --yes "$IMAGE"
          nix run .#cosign -- attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE"

      - name: Publish build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.froment.software
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Join the deployment network
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-actions-deploy
          ping: homelab.panthera-python.ts.net
      - name: Install Nomad
        env:
          NOMAD_VERSION: 1.11.3
          NOMAD_SHA256: 19dac5642a2ba5305e6ff8efee06a708d760ebe4d1cd7936bc3dc526f477dc12
        run: |
          archive="$RUNNER_TEMP/nomad.zip"
          curl --fail --location --silent --show-error \
            "https://releases.hashicorp.com/nomad/$NOMAD_VERSION/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$NOMAD_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/nomad-bin"
          printf '%s\n' "$RUNNER_TEMP/nomad-bin" >>"$GITHUB_PATH"
      - name: Deploy exact image to staging
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          NOMAD_ADDR: http://homelab.panthera-python.ts.net:4646
          NOMAD_NAMESPACE: staging
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/sachahjkl/froment\.software@sha256:[0-9a-f]{64}$ ]]
          nomad job run -detach -var "image=$IMAGE" deploy/nomad/staging.nomad.hcl
          test "$(nomad job inspect -json froment-software | jq -r .Meta.image)" = "$IMAGE"
          version=$(nomad job inspect -json froment-software | jq -r .Version)
          healthy=false
          for _attempt in $(seq 1 90); do
            if nomad job status -json froment-software | jq -e --argjson version "$version" \
              '.[0].Allocations | any(.JobVersion == $version and .DesiredStatus == "run" and .ClientStatus == "running" and .DeploymentStatus.Healthy == true)' \
              >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
      - name: Verify public staging policy
        run: |
          headers="$RUNNER_TEMP/staging-headers"
          body="$RUNNER_TEMP/staging-health"
          status=$(curl --silent --show-error --output "$body" --dump-header "$headers" \
            --write-out '%{http_code}' https://staging.froment.software/api/health)
          test "$status" = 200
          grep --quiet '"status":"ok"' "$body"
          if grep --ignore-case --quiet '^www-authenticate:' "$headers"; then exit 1; fi
          grep --ignore-case --quiet '^x-robots-tag: noindex, nofollow' "$headers"
