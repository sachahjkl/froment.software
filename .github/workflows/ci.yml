name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  NIX_CONFIG: extra-experimental-features = nix-command flakes
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    if: github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --print-build-logs --max-jobs 1

  protected-check:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: nix flake check --print-build-logs --max-jobs 1

  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: protected-check
    runs-on: [self-hosted, nixos]
    concurrency:
      group: publish-image-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
      - run: nix build .#releaseDockerImage --print-build-logs
      - id: publish
        name: Push OCI image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/skopeo-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          export TMPDIR="$RUNNER_TEMP/skopeo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TMPDIR"
          trap 'rm -rf "$TMPDIR"; rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | nix run .#skopeo -- login --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mapfile -t tags < <(printf '%s\n' "$IMAGE_TAGS" | sed '/^$/d')
          (( ${#tags[@]} > 0 )) || exit 0
          nix run .#skopeo -- copy --authfile "$authfile" --insecure-policy docker-archive:result "docker://${tags[0]}"
          for tag in "${tags[@]:1}"; do
            nix run .#skopeo -- copy --all --authfile "$authfile" "docker://${tags[0]}" "docker://$tag"
          done
          digest=$(nix run .#skopeo -- inspect --authfile "$authfile" --format '{{.Digest}}' "docker://${tags[0]}")
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$digest" >>"$GITHUB_OUTPUT"

  deploy-staging:
    needs: publish
    runs-on: [self-hosted, nixos, homelab]
    environment:
      name: staging
      url: https://staging.froment.software
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Deploy exact image to staging
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          deploy=$(readlink -f "$(command -v froment-software-deploy)")
          sudo "$deploy" staging "$IMAGE"
