application:
  name: froment-software
  port: 3000
  healthPath: /api/health

modules:
  config:
    - deploy/config.hcl

environments:
  staging:
    domain: staging.froment.software
    noIndex: true
    modules:
      task:
        - deploy/task-staging.hcl
  production:
    domain: froment.software

    modules:
      task:
        - deploy/task-production.hcl

resources:
  cpu: 1000
  memory: 1024
