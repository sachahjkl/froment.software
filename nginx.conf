user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  map $uri $cache_control {
    default "no-cache";
    "~*-[0-9a-z]{8,}\.(?:css|js|mjs)$" "public, max-age=31536000, immutable";
    "~*\.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?)$" "public, max-age=3600, must-revalidate";
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    server_tokens off;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /404/index.html;

    absolute_redirect off;

    location ~ ^(.+)/+$ {
      return 308 $1$is_args$args;
    }

    location = /404 {
      return 404;
    }

    location = /404/index.html {
      internal;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri/index.html $uri =404;
    }
  }
}
