<section class="login-page" aria-labelledby="back-office-title">
  <div class="login-panel">
    <h1 id="back-office-title">{{ i18n.t('backOffice.title') }}</h1>
    <p>{{ i18n.t('backOffice.intro') }}</p>
    <form (submit)="submit($event, email.value, password.value)">
      <label for="back-office-email"> {{ i18n.t('backOffice.email') }} </label>
      <input
        #email
        id="back-office-email"
        class="input"
        type="email"
        autocomplete="username"
        required
        autofocus
      />
      <label for="back-office-password">{{ i18n.t('backOffice.password') }}</label>
      <input
        #password
        id="back-office-password"
        class="input"
        type="password"
        autocomplete="current-password"
        required
      />
      @if (error(); as errorKey) {
      <p class="error" role="alert">{{ i18n.t(errorKey) }}</p>
      }
      <button appButton variant="primary" type="submit" [disabled]="pending()">
        {{ i18n.t(submitLabel()) }}
      </button>
    </form>
    <div class="bootstrap-slot">
      <a class="bootstrap-link" routerLink="/backoffice/bootstrap">
        {{ i18n.t('backOffice.bootstrap') }}
      </a>
    </div>
  </div>
</section>
