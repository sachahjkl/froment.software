<section class="login-page" aria-labelledby="back-office-title">
  <div class="login-panel">
    <p class="eyebrow">{{ i18n.t('backOffice.kicker') }}</p>
    <h1 id="back-office-title">{{ i18n.t('backOffice.title') }}</h1>
    <p>{{ i18n.t('backOffice.intro') }}</p>
    <form (submit)="submit($event, accessIdentifier.value)">
      <label for="back-office-access-identifier">{{ i18n.t('backOffice.accessIdentifier') }}</label>
      <input
        #accessIdentifier
        id="back-office-access-identifier"
        class="input"
        type="password"
        autocomplete="off"
        required
        autofocus
      />
      @if (error(); as errorKey) {
      <p class="error" role="alert">{{ i18n.t(errorKey) }}</p>
      }
      <button appButton variant="primary" type="submit" [disabled]="pending()">
        {{ i18n.t(pending() ? 'backOffice.pending' : 'backOffice.submit') }}
      </button>
    </form>
    <a appLinkButton variant="link" routerLink="/back-office/bootstrap">
      {{ i18n.t('backOffice.bootstrap') }}
    </a>
  </div>
</section>
