<article class="home">
  <header class="intro">
    <div class="identity">
      <img src="/brand/icon-192.png" width="72" height="72" alt="" />
      <div class="identity-name">
        <strong>froment.software</strong>
        <app-new-label ngSkipHydration />
      </div>
    </div>
    <h1>{{ i18n.t("home.hero.title") }}</h1>
    <div class="contact-links">
      <a
        appLinkButton
        variant="primary"
        size="large"
        icon="mail"
        href="mailto:contact@froment.software"
      >
        {{ i18n.t("home.engage.mail") }}
      </a>
      <a
        appLinkButton
        size="large"
        icon="calendar"
        href="https://cal.com/sachahjkl"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ i18n.t("home.hero.book") }}
      </a>
    </div>
  </header>

  <section aria-labelledby="projects-title">
    <h2 id="projects-title">{{ i18n.t("home.timeline.title") }}</h2>
    <div class="projects">
      <a href="https://albumator.sacha.house" target="_blank" rel="noopener noreferrer">
        <img src="/projects/albumator.png" width="48" height="48" alt="" loading="lazy" />
        <span>{{ projectNames.albumator }} <span aria-hidden="true">↗</span></span>
      </a>
      <a href="https://clockin.sacha.house" target="_blank" rel="noopener noreferrer">
        <img src="/projects/clockin.png" width="48" height="48" alt="" loading="lazy" />
        <span>{{ projectNames.clockin }} <span aria-hidden="true">↗</span></span>
      </a>
      <a href="https://github.com/sachahjkl/dw" target="_blank" rel="noopener noreferrer">
        <img src="/projects/dw.png" width="48" height="48" alt="" loading="lazy" />
        <span>{{ projectNames.dw }} <span aria-hidden="true">↗</span></span>
      </a>
      <a href="https://github.com/sachahjkl/backoffice" target="_blank" rel="noopener noreferrer">
        <img src="/projects/backoffice.png" width="48" height="48" alt="" loading="lazy" />
        <span>{{ projectNames.backoffice }} <span aria-hidden="true">↗</span></span>
      </a>
    </div>
  </section>
</article>
