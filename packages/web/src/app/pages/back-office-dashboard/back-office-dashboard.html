<section class="dashboard" aria-labelledby="dashboard-title">
  <header>
    <h1 id="dashboard-title">{{ i18n.t('backOffice.title') }}</h1>
    <button appButton type="button" (click)="signOut()">{{ i18n.t('backOffice.signOut') }}</button>
  </header>
  <ul class="document-list">
    <li>
      <h2>{{ i18n.t('backOffice.clients.title') }}</h2>
      <a appLinkButton variant="primary" routerLink="/backoffice/clients">
        {{ i18n.t('backOffice.open') }}
      </a>
    </li>
    <li>
      <h2>{{ i18n.t('backOffice.quotes.title') }}</h2>
      <a appLinkButton variant="primary" routerLink="/backoffice/quotes">
        {{ i18n.t('backOffice.open') }}
      </a>
    </li>
    <li>
      <h2>{{ i18n.t('backOffice.businessCard') }}</h2>
      <a appLinkButton variant="primary" routerLink="/backoffice/business-card">
        {{ i18n.t('backOffice.open') }}
      </a>
    </li>
  </ul>
</section>
