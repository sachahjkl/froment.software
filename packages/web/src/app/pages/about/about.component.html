<article class="about">
  <header class="page-intro">
    <h1>{{ i18n.t("about.faq.title") }}</h1>
  </header>

  <section [attr.aria-label]="i18n.t('about.faq.label')">
    <div class="faq-list ds-panel">
      @for (item of faqKeys; track item.questionKey) {
        <details class="faq-item">
          <summary>
            <span>{{ i18n.t(item.questionKey) }}</span>
            <span class="faq-marker" aria-hidden="true"></span>
          </summary>
          <div class="faq-answer">
            <p>{{ i18n.t(item.answerKey) }}</p>
          </div>
        </details>
      }
    </div>
  </section>

  <section class="contact-panel" aria-labelledby="contact">
    <h2 id="contact" class="anchored-title">
      <span>{{ i18n.t("about.contact.title") }}</span
      ><app-anchor-link fragment="contact" />
    </h2>
    <app-contact-actions
      class="contact-actions"
      [mailLabel]="i18n.t('about.contact.mail')"
      [bookLabel]="i18n.t('about.contact.book')"
      [subject]="i18n.t('home.engage.subject')"
      [body]="i18n.t('home.engage.body')"
    />
  </section>
</article>
