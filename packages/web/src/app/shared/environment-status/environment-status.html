@if (environmentStatus; as status) {
<a
  class="environment-ribbon"
  [class.header-link]="headerLink()"
  [class.staging]="environment === 'staging'"
  routerLink="/version"
  [attr.aria-label]="i18n.t(status.nameKey)"
>
  {{ i18n.t(status.labelKey) }}
</a>
} @else if (headerLink()) {
<a class="version-link" routerLink="/version">{{ i18n.t('nav.version') }}</a>
} @if (publicPage()) {
<aside class="construction-notice runtime-construction-only" aria-labelledby="construction-title">
  <div class="construction-inner">
    <p class="construction-kicker">{{ i18n.t("shell.construction.kicker") }}</p>
    <div>
      <h2 id="construction-title">{{ i18n.t("shell.construction.title") }}</h2>
      <p>{{ i18n.t("shell.construction.description") }}</p>
    </div>
  </div>
</aside>
}
