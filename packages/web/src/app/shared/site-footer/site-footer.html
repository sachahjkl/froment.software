<footer class="footer">
  <div class="footer-inner">
    <p>{{ i18n.tf('footer.rights', { year: currentYear }) }}</p>
    <p><a href="mailto:contact@froment.software">contact@froment.software</a></p>
    <nav class="footer-legal" [attr.aria-label]="i18n.t('shell.legal_nav')">
      <a
        routerLink="/backoffice/login"
        [queryParams]="{ mode: 'admin' }"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >{{ i18n.t('backOffice.title') }}</a
      >
      <a routerLink="/legal" routerLinkActive="active" ariaCurrentWhenActive="page"
        >{{ i18n.t('nav.legal') }}</a
      >
      <a routerLink="/privacy" routerLinkActive="active" ariaCurrentWhenActive="page"
        >{{ i18n.t('nav.privacy') }}</a
      >
      <a routerLink="/cookies" routerLinkActive="active" ariaCurrentWhenActive="page"
        >{{ i18n.t('nav.cookies') }}</a
      >
      <a routerLink="/version" routerLinkActive="active" ariaCurrentWhenActive="page"
        >{{ i18n.t('nav.version') }}</a
      >
    </nav>
  </div>
</footer>
