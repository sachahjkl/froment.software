<dt>{{ label() }}</dt>
<dd>
  @if (editing()) {
  <form (submit)="submit($event)">
    <label class="visually-hidden" [for]="controlId">{{ label() }}</label>
    <div class="edit-control">
      @if (options().length > 0) {
      <select
        class="select"
        [id]="controlId"
        [value]="draft()"
        [disabled]="saving()"
        (change)="draft.set($any($event.target).value)"
      >
        @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
      } @else {
      <input
        class="input"
        [id]="controlId"
        [type]="inputType()"
        [value]="draft()"
        [required]="required()"
        [maxLength]="maximumLength() ?? null"
        [disabled]="saving()"
        (input)="draft.set($any($event.target).value)"
      />
      }
      <div class="edit-actions">
        <app-hint [text]="i18n.t('inlineEdit.save')">
          <button
            appButton
            type="submit"
            variant="ghost"
            [iconOnly]="true"
            [disabled]="saving()"
            [attr.aria-label]="i18n.t('inlineEdit.save')"
          >
            <app-icon name="check" />
          </button>
        </app-hint>
        <app-hint [text]="i18n.t('inlineEdit.cancel')">
          <button
            appButton
            type="button"
            variant="ghost"
            [iconOnly]="true"
            [disabled]="saving()"
            [attr.aria-label]="i18n.t('inlineEdit.cancel')"
            (click)="cancelRequested.emit()"
          >
            <app-icon name="close" />
          </button>
        </app-hint>
      </div>
    </div>
  </form>
  } @else {
  <span>{{ displayValue() || value() || emptyValue() }}</span>
  @if (editable()) {
  <button
    appButton
    type="button"
    variant="ghost"
    [iconOnly]="true"
    [attr.aria-label]="i18n.tf('inlineEdit.editField', { field: label() })"
    (click)="editRequested.emit()"
  >
    <app-icon name="pencil" />
  </button>
  } }
</dd>
