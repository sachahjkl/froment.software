<div class="field">
  <span [id]="controlId() + '-label'" class="label">{{ label() }}</span>
  <div class="editor">
    <app-icon-toolbar
      [label]="i18n.t('documentText.formatting')"
      [groups]="toolbar()"
      [disabled]="disabled()"
      (activated)="apply($event)"
    />
    <div #editorHost></div>
  </div>
</div>
<label class="field placement">
  {{ i18n.t('documentText.placement') }}
  <select
    class="select"
    #position
    [value]="placement()"
    [disabled]="disabled()"
    (change)="changePlacement(position.value)"
    (blur)="touch.emit()"
  >
    @for (item of placements; track item.value) {
    <option [value]="item.value">{{ i18n.t(item.label) }}</option>
    }
  </select>
</label>
