<header class="back-office-header">
  <div class="header-inner">
    <div class="identity-row">
      <a
        class="brand"
        [routerLink]="administrator() ? '/backoffice/dashboard' : '/backoffice/client'"
      >
        <img src="/brand/favicon.png" alt="" width="36" height="36" />
        <span
          ><strong>froment.software</strong
          ><small>{{ i18n.t('backOffice.header.name') }}</small></span
        >
      </a>
      <div class="account-controls">
        @if (account(); as current) {
        <span class="account"
          ><small>{{ i18n.t('backOffice.header.account') }}</small>{{ current.email }}</span
        >
        }
        <button
          class="sign-out"
          appButton
          variant="danger"
          type="button"
          [attr.aria-label]="i18n.t('backOffice.signOut')"
          (click)="signOut()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9" />
          </svg>
          <span class="sign-out-label">{{ i18n.t('backOffice.signOut') }}</span>
        </button>
      </div>
    </div>
  </div>
  @if (administrator()) {
  <div class="navigation-row"><app-back-office-nav /></div>
  }
</header>
