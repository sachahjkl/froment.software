<nav class="tab-list" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.id) { @if (tab.path; as path) {
  <a
    [id]="tab.id"
    [routerLink]="path"
    [queryParams]="tab.queryParams"
    [queryParamsHandling]="queryParamsHandling(tab)"
    [preserveFragment]="preserveFragment()"
    routerLinkActive
    #route="routerLinkActive"
    [routerLinkActiveOptions]="activeOptions(tab)"
    [class.active]="isActive(tab, route.isActive)"
    [ariaCurrentWhenActive]="currentPage(tab)"
    [attr.aria-disabled]="disabled()"
  >
    {{ tab.label }}
  </a>
  } @else {
  <button
    type="button"
    [class.active]="tab.active"
    [attr.aria-current]="tab.active ? 'page' : null"
    [disabled]="disabled()"
    (click)="tabSelected.emit(tab.id)"
  >
    {{ tab.label }}
  </button>
  } }
</nav>
