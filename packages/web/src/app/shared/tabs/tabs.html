<nav class="tab-list" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.id) {
  <a
    [id]="tab.id"
    [routerLink]="tab.path"
    [queryParamsHandling]="preserveQuery() ? 'preserve' : ''"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [routerLinkActiveOptions]="{ paths: tab.exact === false ? 'subset' : 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
    [attr.aria-disabled]="disabled()"
    (click)="disabled() && $event.preventDefault()"
  >
    {{ tab.label }}
  </a>
  }
</nav>
