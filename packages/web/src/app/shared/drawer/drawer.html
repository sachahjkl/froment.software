<ng-template #content>
  <div class="drawer-body">
    <div class="drawer-heading">
      <div class="drawer-title">
        <ng-content select="[drawerHeading]"><strong>{{ label() }}</strong></ng-content>
      </div>
      <button
        appButton
        data-drawer-close
        type="button"
        [attr.aria-label]="closeLabel()"
        [style.min-block-size]="closeButtonHeight()"
        (click)="closed.emit()"
      >
        <app-icon name="close" />
      </button>
    </div>
    <ng-content />
  </div>
</ng-template>
