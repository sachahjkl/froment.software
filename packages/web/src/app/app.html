<div class="app-shell" [class.back-office-shell]="backOffice()">
  <a class="skip-link" href="#main-content">{{ i18n.t("shell.skip") }}</a>
  @if (backOffice()) {
  <app-back-office-header [administrator]="administrator()" />
  } @else {
  <app-site-header />
  }
  <main id="main-content" tabindex="-1">
    <router-outlet />
  </main>
  <app-site-footer [showPreferences]="backOffice()" />
  <app-copy-notice />
</div>
