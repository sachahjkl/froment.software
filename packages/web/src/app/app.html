<div
  class="app-shell"
  [class.back-office-shell]="backOffice()"
  [class.standalone-shell]="standalonePage()"
>
  <a
    class="skip-link"
    href="#main-content"
    (click)="$event.preventDefault(); mainContent.focus({ preventScroll: true })"
    >{{ i18n.t("shell.skip") }}</a
  >
  @if (backOffice()) { @defer (when backOffice()) {
  <app-back-office-header [administrator]="administrator()" />
  } } @else if (!standalonePage()) {
  <app-site-header />
  }
  <main #mainContent id="main-content" tabindex="-1">
    <router-outlet />
  </main>
  @if (!backOffice() && !standalonePage()) { <app-site-footer /> }
  <app-copy-notice />
</div>
